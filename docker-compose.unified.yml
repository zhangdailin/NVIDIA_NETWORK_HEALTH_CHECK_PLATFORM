version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
    environment:
      - CORS_ORIGINS=http://localhost:8000
      - SERVICE_TIMEOUT_SECONDS=60
      - RETURN_ONLY_ISSUES=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
